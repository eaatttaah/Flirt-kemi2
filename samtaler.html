<!doctype html><html lang="da"><head><meta charset="utf-8"><meta name="robots" content="noindex"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Samtaler – Flirt &amp; Kemi</title><style>[hidden]{display:none!important}.regbg{background:linear-gradient(180deg,#fff3f866,#fff3f8aa 80%),url(/hero.jpg) 62% bottom/cover fixed no-repeat}.regbg #reg,.regbg .panel{background:#ffffffd9;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}.ib svg,.btn svg{display:block;margin:auto}*{box-sizing:border-box}body{margin:0;background:linear-gradient(160deg,#fff1e8,#ffd9e8 55%,#eadcff);min-height:100vh;color:#3b2a3f;font:16px/1.5 Arial,Helvetica,sans-serif}

</style></head><body><div class="wrap"><div class="top"><b>Flirt &amp; Kemi</b><a href="/samtaler.html" id="n1">Samtaler</a><a href="/profil.html" id="n2">Min profil</a><span class="sp"></span><a href="#" id="out">Log ud</a><div class="pill"><span id="cr">–</span> kreditter<a href="/buy.html">+ Køb</a></div></div><div class="panel">
<div class="pad" style="padding-bottom:4px"><h2>Dine samtaler</h2></div><div id="convs"></div>
<div class="pad" style="padding-bottom:4px"><h2>Find en profil at skrive med</h2><div class="muted">Alle profiler er fiktive og styres af vores moderatorer · Kun 18+</div></div><div id="profs"></div>
</div><div class="foot"><a href="/">Forside</a> · <a href="/vilkaar.html">Vilkår</a> · <a href="/privatliv.html">Privatliv</a> · Profilerne er fiktive og styres af moderatorer · Kun 18+</div></div><script>const $=i=>document.getElementById(i),esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let CID=localStorage.getItem('cid');
const j=async(url,method,body)=>{const r=await fetch(url,{method:method||'GET',headers:{'Content-Type':'application/json'},body:body&&JSON.stringify(body)});let d={};try{d=await r.json()}catch(e){}if(!r.ok){const er=new Error(d.error||'Noget gik galt');er.status=r.status;throw er}return d};
const initial=n=>esc((n||'?').trim().charAt(0).toUpperCase());
const avatar=(me,cls)=>me&&me.avatar?'<img class="av '+(cls||'')+'" src="/img/'+esc(me.avatar)+'" alt="">':'<div class="av '+(cls||'')+'">'+initial(me&&me.name)+'</div>';
const shrink=(file,max)=>new Promise((ok,no)=>{const fr=new FileReader();fr.onerror=()=>no(new Error('Kunne ikke læse billedet'));fr.onload=()=>{const im=new Image();im.onerror=()=>no(new Error('Det er ikke et gyldigt billede'));im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*k));c.height=Math.max(1,Math.round(im.height*k));const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',.82))};im.src=fr.result};fr.readAsDataURL(file)});
const upload=(kind,file,max)=>shrink(file,max).then(data=>j('/api/upload/'+CID,'POST',{kind:kind,data:data}));
const outEl=document.getElementById('out');if(outEl)outEl.onclick=e=>{e.preventDefault();localStorage.removeItem('cid');location.href='/'};
const gone=()=>{localStorage.removeItem('cid');location.replace('/login.html')};
if(!CID)location.replace('/login.html');
$('n1').classList.add('on');
const ago=a=>{const d=new Date(a),t=new Date();return d.toDateString()===t.toDateString()?d.toLocaleTimeString('da-DK',{hour:'2-digit',minute:'2-digit'}):d.toLocaleDateString('da-DK',{day:'2-digit',month:'short'})};
async function load(){try{const d=await j('/api/convs/'+CID);$('cr').textContent=d.me.credits;
 $('convs').innerHTML=d.convs.length?d.convs.map(c=>'<a class="row" href="/chat.html?p='+encodeURIComponent(c.pid)+'">'+avatar(c)+'<div class="t"><b>'+esc(c.name)+'<span class="tagf">fiktiv profil</span></b><small>'+(c.from==='c'?'Dig: ':'')+esc(c.last)+'</small></div><div class="when">'+ago(c.at)+'</div></a>').join(''):'<div class="pad muted" style="padding-top:0">Du har ikke skrevet med nogen endnu. Vælg en profil herunder.</div>';
 $('profs').innerHTML=d.profiles.length?d.profiles.map(p=>'<a class="row" href="/chat.html?p='+encodeURIComponent(p.id)+'">'+avatar(p)+'<div class="t"><b>'+esc(p.name)+'<span class="tagf">fiktiv profil</span>'+(p.label?'<span class="tagf">'+esc(p.label)+'</span>':'')+'</b><small>'+esc(p.tagline)+'</small></div><span class="btn">Skriv</span></a>').join(''):'<div class="pad muted">Ingen profiler endnu.</div>'}
 catch(e){if(e.status===404)gone()}}
if(CID){load();setInterval(load,5000)}</script></body></html>
